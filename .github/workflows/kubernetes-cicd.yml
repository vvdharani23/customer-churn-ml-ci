
name: Customer Churn Kubernetes CD

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "k8s/**"
      - ".github/workflows/kubernetes-cicd.yml"

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Kubernetes access
        shell: powershell
        run: |
          kubectl config current-context
          kubectl get deployment customer-churn-api
          kubectl get pods

      - name: Save previous image
        shell: powershell
        run: |
          $image = kubectl get deployment customer-churn-api -o jsonpath="{.spec.template.spec.containers[0].image}"
          if ($LASTEXITCODE -ne 0 -or -not $image) {
            throw "Could not read the current deployment image."
          }
          "PREVIOUS_IMAGE=$image" >> $env:GITHUB_ENV

      - name: Deploy Customer Churn image
        shell: powershell
        run: |
          kubectl set image deployment/customer-churn-api customer-churn-api=ghcr.io/vvdharani23/customer-churn-ml:latest
          if ($LASTEXITCODE -ne 0) { throw "Image update failed." }

          kubectl rollout status deployment/customer-churn-api --timeout=180s
          if ($LASTEXITCODE -ne 0) {
            kubectl rollout undo deployment/customer-churn-api
            throw "Deployment failed; rollback requested."
          }

      - name: Verify deployment and pods
        shell: powershell
        run: |
          kubectl get deployment customer-churn-api
          kubectl get pods -l app=customer-churn-api
