name: Customer Churn ML CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Train model
        run: python train_model.py

      - name: Run tests
        run: pytest test_ml_pipeline.py

      - name: Run quality gate
        run: python quality_gate.py

      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-artifacts
          path: |
            wrong_model.pkl
          retention-days: 7
