name: Customer Churn ML CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Train model
        run: python train_model.py

      - name: Run tests
        run: pytest test_ml_pipeline.py

      - name: Run quality gate
        run: python quality_gate.py
      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp customer_churn_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf "Customer Churn Prediction ML Application
          Run: python app.py
          Endpoint: POST /predict
          " > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-artifacts
          path: |
            customer_churn_model.pkl
            metrics.json
            customer_churn_raw_50_samples (1).csv
          if-no-files-found: error
          retention-days: 7
