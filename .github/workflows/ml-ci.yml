name: Customer Churn ML CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Train model
        run: python train_model.py

      - name: Run tests
        run: pytest test_ml_pipeline.py

      - name: Run quality gate
        run: python quality_gate.py
      - name: Run prediction application tests
        run: python -m unittest test_app.py -v
      - name: Build Docker image
        run: docker build -t customer-churn-ml:${{ github.sha }} .

      - name: Start Docker container
        run: |
          docker run -d \
            --name customer-churn-container \
            -p 5000:5000 \
            customer-churn-ml:${{ github.sha }}

      - name: Wait for application to become ready
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/; then
              echo "Application is ready."
              exit 0
            fi
            echo "Waiting for application... attempt $i"
            sleep 2
          done
          docker logs customer-churn-container
          exit 1

      - name: Test prediction endpoint
        run: |
          response=$(curl --fail --silent --show-error \
            -X POST \
            -H "Content-Type: application/json" \
            -d '{
              "Age": 25,
              "TenureMonths": 2,
              "MonthlyCharges": 110,
              "TotalCharges": 220,
              "Contract": "Month-to-month",
              "InternetService": "Fiber optic",
              "PaymentMethod": "Electronic check",
              "SupportCalls": 8,
              "SatisfactionScore": 1
            }' \
            http://localhost:5000/predict)

          echo "Prediction response: $response"
          echo "$response" | grep -q '"prediction"'

      - name: Show Docker container logs
        if: always()
        run: docker logs customer-churn-container || true

      - name: Stop and remove Docker container
        if: always()
        run: docker rm -f customer-churn-container || true
      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp customer_churn_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          cp Dockerfile release_candidate/
          cp .dockerignore release_candidate/
          printf "Customer Churn Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n" > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7
      - name: Upload ML artifacts
        uses: actions/upload-artifact@v4
        with:
          name: customer-churn-ml-artifacts
          path: |
            customer_churn_model.pkl
            metrics.json
            customer_churn_raw_50_samples (1).csv
          if-no-files-found: error
          retention-days: 7
